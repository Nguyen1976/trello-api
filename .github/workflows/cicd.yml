name: Deploy Node Application

on:
  push:
    branches:
      - aws-production-env

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t nguyen1976/trello-api .

      - name: Public Image to Docker Hub
        run: docker push nguyen1976/trello-api:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Stop old container
        run: |
          docker stop nodejs-app-container || true
          docker rm nodejs-app-container || true
      - name: Pull image from docker hub
        run: docker pull nguyen1976/trello-api:latest
      - name: Create .env file
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "LOCAL_DEV_APP_HOST=${{ secrets.LOCAL_DEV_APP_HOST }}" >> .env
          echo "LOCAL_DEV_APP_PORT=${{ secrets.LOCAL_DEV_APP_PORT }}" >> .env
          echo "AUTHOR=${{ secrets.AUTHOR }}" >> .env
          echo "WEBSITE_DOMAIN_DEVELOPMENT=${{ secrets.WEBSITE_DOMAIN_DEVELOPMENT }}" >> .env
          echo "WEBSITE_DOMAIN_PRODUCTION=${{ secrets.WEBSITE_DOMAIN_PRODUCTION }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "ADMIN_EMAIL_ADDRESS=${{ secrets.ADMIN_EMAIL_ADDRESS }}" >> .env
          echo "ADMIN_EMAIL_APP_PASSWORD=${{ secrets.ADMIN_EMAIL_APP_PASSWORD }}" >> .env
          echo "ADMIN_EMAIL_NAME=${{ secrets.ADMIN_EMAIL_NAME }}" >> .env
          echo "ACCESS_TOKEN_SECRET_SIGNATURE=${{ secrets.ACCESS_TOKEN_SECRET_SIGNATURE }}" >> .env
          echo "ACCESS_TOKEN_LIFE=${{ secrets.ACCESS_TOKEN_LIFE }}" >> .env
          echo "REFRESH_TOKEN_SECRET_SIGNATURE=${{ secrets.REFRESH_TOKEN_SECRET_SIGNATURE }}" >> .env
          echo "REFRESH_TOKEN_LIFE=${{ secrets.REFRESH_TOKEN_LIFE }}" >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env
      - name: Run Node.js Docker container
        run: docker run -d -p 8017:8017 --name nodejs-app-container --env-file .env nguyen1976/trello-api
