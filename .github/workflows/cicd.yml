name: Deploy Node API to ECR and Refresh ASG

on:
  push:
    branches:
      - aws-production-env

jobs:
  build_and_push_ecr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # 1. Cấu hình AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Đăng nhập vào ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      # 3. Định nghĩa Image URI
      - name: Set ECR Image URI (latest tag)
        id: set_uri
        run: |
          # Đảm bảo Repository Node API có tên là trello-node
          ECR_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME_NODE }}:latest
          echo "ECR_URI=$ECR_URI" >> $GITHUB_OUTPUT

      # 4. Build và Tag Image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.ECR_REPOSITORY_NAME_NODE }}:latest . 
        
      # 5. Tag và Push Image lên ECR
      - name: Tag and Push Image to ECR
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY_NAME_NODE }}:latest ${{ steps.set_uri.outputs.ECR_URI }}
          docker push ${{ steps.set_uri.outputs.ECR_URI }}

    # KHÔNG CẦN CHUYỂN OUTPUT VÌ CHÚNG TA KHÔNG CẦN BIẾN IMAGE_URI CHO ASG REFRESH

  # 6. Kích hoạt Instance Refresh
  deploy_asg:
    needs: build_and_push_ecr
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials for ASG
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Trigger ASG Instance Refresh
        run: |
          echo "Bắt đầu Instance Refresh cho ASG Node API: ${{ secrets.ASG_NAME_NODE }}..."
          
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME_NODE }} \
            --preferences '{"MinHealthyPercentage": 90}'
          
          echo "✅ Instance Refresh đã bắt đầu. Instance mới sẽ pull image mới nhất từ ECR."